[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-tennis"
version = "0.1.0"
description = "Project Horizon Tennis: monocular 3D reconstruction, player POV cameras and a free camera for broadcast tennis clips"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "imageio-ffmpeg>=0.5.1",
  "pillow>=10.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "boto3>=1.34",
]

[project.optional-dependencies]
ml = ["torch>=2.4", "transformers>=4.45", "ultralytics>=8.3", "lap>=0.5.12"]
viewer = ["viser>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
horizon = "horizon.cli:main"

[tool.setuptools.packages.find]
include = ["horizon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
